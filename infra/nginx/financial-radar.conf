# Issue the api.radar.amazingzsys.site certificate before enabling; see docs/24-server-api-radar-amazingzsys-site.md.
server {
    listen 443 ssl;
    server_name api.radar.amazingzsys.site;
    ssl_certificate /etc/letsencrypt/live/api.radar.amazingzsys.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.radar.amazingzsys.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    access_log /var/log/nginx/financial-radar.access.log;
    error_log /var/log/nginx/financial-radar.error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security 'max-age=31536000' always;
    location / {
        proxy_pass http://127.0.0.1:13000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
server {
    listen 80;
    server_name api.radar.amazingzsys.site;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
